server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # www.alanadi -> alanadi (Cloudflare Tunnel, gelen Host başlığını olduğu gibi iletir)
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # Vite'ın içerik özetli dosyaları: adı değişmeden içeriği değişmez.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Tek sayfalık site: HTML her zaman yeniden doğrulansın ki yeni sürüm hemen görünsün.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
